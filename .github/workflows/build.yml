name: Build Windows exe

# Push a tag like "v1.0.0" to build the exe and attach it to a new
# GitHub Release automatically. You can also trigger a build manually
# (Actions tab -> Build Windows exe -> Run workflow) to sanity-check
# that it still builds, without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller nfstr_modmenu.spec --noconfirm

      - name: Smoke-test the data bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\NFSTR-ModMenu.exe")) {
            Write-Error "Build did not produce dist\NFSTR-ModMenu.exe"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR-ModMenu-windows
          path: dist/NFSTR-ModMenu.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NFSTR-ModMenu.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
